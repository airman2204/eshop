<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="boxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DF7F2D"/>
      <stop offset="100%" stop-color="#B85D10"/>
    </linearGradient>
    <linearGradient id="lidGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#DF7F2D"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradient)" rx="24"/>
  <rect x="12" y="12" width="376" height="376" fill="none" stroke="#E2E8F0" stroke-width="2" rx="20"/>

  <!-- Elegant 3D E-Commerce Box Icon -->
  <g transform="translate(130, 110)">
    <!-- Shadow under box -->
    <ellipse cx="70" cy="135" rx="55" ry="12" fill="#0F172A" opacity="0.08"/>
    
    <!-- Box Body (Isometric / stylized) -->
    <!-- Left Face -->
    <path d="M15 45 L70 75 L70 130 L15 100 Z" fill="url(#boxGradient)"/>
    <!-- Right Face -->
    <path d="M70 75 L125 45 L125 100 L70 130 Z" fill="#9A4C0B"/>
    <!-- Top Face (Lid) -->
    <path d="M70 15 L125 45 L70 75 L15 45 Z" fill="url(#lidGradient)"/>
    
    <!-- Ribbon / Tape Accent -->
    <path d="M62 19 L78 28 L78 130 L62 121 Z" fill="#FFFFFF" opacity="0.28"/>
    <path d="M15 45 L70 75 L70 82 L15 52 Z" fill="#FFFFFF" opacity="0.15"/>
    <path d="M70 75 L125 45 L125 52 L70 82 Z" fill="#000000" opacity="0.12"/>
    
    <!-- Sparkle / Star top right -->
    <path d="M132 18 Q132 26 140 26 Q132 26 132 34 Q132 26 124 26 Q132 26 132 18 Z" fill="#DF7F2D"/>
  </g>

  <!-- Title -->
  <text x="200" y="278" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#334155" text-anchor="middle" letter-spacing="0.3">
    FoxDrop
  </text>
  <text x="200" y="300" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="0.2">
    Producto de Catálogo
  </text>
</svg>
